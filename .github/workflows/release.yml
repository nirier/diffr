name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: diffr
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            binary: diffr
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            binary: diffr.exe
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: diffr
          - target: aarch64-apple-darwin
            os: macos-15
            binary: diffr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          manifest = Path('Cargo.toml').read_text()
          version = re.search(r'^version = "([^"]+)"$', manifest, re.MULTILINE).group(1)
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match the Cargo.toml version')
          PY

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.target }}'

      - name: Install musl compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build
        run: cargo build --locked --release --target '${{ matrix.target }}'

      - name: Test release binary and algorithms
        run: |
          export DIFFR_TESTS_BINARY_PATH="$(python -c 'from pathlib import Path; print(Path("target/${{ matrix.target }}/release/${{ matrix.binary }}").resolve())')"
          # Existing algorithm tests rely on debug assertions; CLI tests
          # exercise the release binary through DIFFR_TESTS_BINARY_PATH.
          cargo test --locked --target '${{ matrix.target }}'
          "./target/${{ matrix.target }}/release/${{ matrix.binary }}" --version
          if [ '${{ matrix.target }}' = x86_64-unknown-linux-musl ]; then
            if readelf -l "$DIFFR_TESTS_BINARY_PATH" | grep -q INTERP; then
              echo 'musl binary must be statically linked' >&2
              exit 1
            fi
          fi

      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          archive="diffr-${RELEASE_TAG}-${RELEASE_TARGET}"
          mkdir -p "dist/$archive"
          cp "target/$RELEASE_TARGET/release/${{ matrix.binary }}" README.md LICENSE.txt CHANGELOG.md assets/diffr.1.md "dist/$archive/"
          if [ '${{ runner.os }}' = Windows ]; then
            python - "$archive" <<'PY'
          import shutil
          import sys
          shutil.make_archive('dist/' + sys.argv[1], 'zip', 'dist', sys.argv[1])
          PY
          else
            tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: diffr-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: diffr-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Preserve already published archives when adding platforms.
            gh release download "$RELEASE_TAG" --dir dist --clobber
          fi
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --verify-tag --title "diffr $RELEASE_TAG" --generate-notes
          fi
